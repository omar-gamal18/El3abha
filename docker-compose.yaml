services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: el3abha
      POSTGRES_USER: el3abha
      POSTGRES_PASSWORD: el3abha123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U el3abha -d el3abha"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://el3abha:el3abha123@db:5432/el3abha
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3000"

volumes:
  postgres_data:
